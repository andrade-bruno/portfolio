<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- outer hexagon -->
  <polygon
    points="32,4 58,18 58,46 32,60 6,46 6,18"
    fill="none"
    stroke="#ff6c01"
    stroke-width="4"
    stroke-linejoin="round"
  />
  <!-- inner filled hexagon, slightly smaller -->
  <polygon
    points="32,14 50,24 50,40 32,50 14,40 14,24"
    fill="#ff6c01"
    opacity="0.12"
  />
  <!-- center circle -->
  <circle cx="32" cy="32" r="8" fill="none" stroke="#ff6c01" stroke-width="4" />
  <!-- center dot -->
  <circle cx="32" cy="32" r="3" fill="#ff6c01" />
</svg>
